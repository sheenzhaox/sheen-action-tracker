<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src 'self' file: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Action Tracker · Option C · Mobile focus</title>
  <style>
    /* shadcn "maia" feel: soft, rounded (12–20px), generous spacing, 44px+ controls */
    :root {
      color-scheme: dark;
      --background: #0f0f11; --foreground: #fafafa; --card: #1b1b1f; --popover: #202024;
      --muted: #26262b; --muted-foreground: #b4b4bd; --border: #34343b;
      --input: #6f6f7a; --primary: #f97316; --primary-foreground: #18181b;
      --accent: #2c2c32; --primary-text: #fdba74; --ring: #fdba74;
      --valid: #86d9a8; --warning: #fcd177; --experimental: #d3b9f4;
      --radius: 14px; --radius-lg: 20px; --left: #22d3ee; --right: #f97316; --select: #facc15;
      --s1: #f97316; --s2: #fdba74; --s3: #a1a1aa;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      --peek: 196px;
    }
    [data-theme="light"] {
      color-scheme: light;
      --background: #f4f4f5; --foreground: #18181b; --card: #ffffff; --popover: #ffffff;
      --muted: #ececef; --muted-foreground: #595963; --border: #dadade;
      --input: #777782; --primary: #ea580c; --primary-foreground: #18181b;
      --accent: #e6e6ea; --primary-text: #9a3412; --ring: #9a3412;
      --valid: #166534; --warning: #854d0e; --experimental: #6b21a8;
      --s1: #ea580c; --s2: #9a3412; --s3: #52525b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--background); color: var(--foreground); font: 15px/1.5 var(--font); -webkit-text-size-adjust: 100%; overflow: hidden; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    [hidden] { display: none !important; }
    h1, h2, h3, p { margin: 0; }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted-foreground); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .icon { display: inline-flex; flex: none; }
    .icon svg { width: 20px; height: 20px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); font-weight: 600; white-space: nowrap; }
    .button:hover { background: var(--accent); }
    .button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
    .button.ghost { background: transparent; border-color: transparent; }
    .button.icon-only { width: 44px; padding: 0; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; background: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1.6; }
    .badge .icon svg { width: 14px; height: 14px; }
    .valid { color: var(--valid); } .warning { color: var(--warning); } .experimental { color: var(--experimental); } .unavailable { color: var(--muted-foreground); }

    .app { height: 100svh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
    .topbar { display: flex; align-items: center; gap: 6px; padding: max(8px, env(safe-area-inset-top)) 12px 4px; }
    .title { flex: 1; min-width: 0; text-align: center; }
    .title strong { display: block; font: 600 16px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title span { font-size: 12px; color: var(--muted-foreground); }
    .option-badge { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -140%); }
    .segmented { margin: 4px 16px 10px; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; gap: 4px; background: var(--muted); border-radius: 999px; }
    .segmented button { min-height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--muted-foreground); font-weight: 600; font-size: 14px; }
    .segmented button[aria-pressed="true"] { background: var(--card); color: var(--foreground); box-shadow: 0 1px 3px #0000002e; }

    .stage-area { position: relative; min-height: 0; display: flex; flex-direction: column; padding: 0 12px calc(var(--peek) + 8px); gap: 10px; }
    .stage { position: relative; flex: 1; min-height: 0; border-radius: var(--radius-lg); overflow: hidden; background: #0b0b0d; }
    .stage canvas, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; }
    .stage video { object-fit: contain; opacity: 0; pointer-events: none; }
    .stage video[hidden] { display: none; }
    .chip { position: absolute; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #000000b3; color: #fafafa; font-size: 12px; font-weight: 600; backdrop-filter: blur(6px); }
    .chip.tl { top: 12px; left: 12px; } .chip.tr { top: 12px; right: 12px; }
    .chip .icon svg { width: 14px; height: 14px; }
    .transport { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); }
    .transport .play { width: 48px; height: 48px; border-radius: 999px; border: 0; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; flex: none; }
    .scrub-wrap { position: relative; flex: 1; min-width: 0; }
    .scrub-wrap input { width: 100%; accent-color: var(--primary); min-height: 44px; margin: 0; display: block; }
    .marks { position: absolute; left: 8px; right: 8px; top: 2px; height: 6px; pointer-events: none; }
    .marks i { position: absolute; width: 6px; height: 6px; margin-left: -3px; border-radius: 99px; background: var(--foreground); }
    .marks i.na { background: transparent; border: 1.5px solid var(--muted-foreground); }
    .time { font-size: 13px; padding-right: 10px; white-space: nowrap; }

    /* Drawer (vaul-style) */
    .drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: calc(100svh - 72px); background: var(--popover); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-top: 1px solid var(--border); box-shadow: 0 -12px 40px #00000040; display: flex; flex-direction: column; transform: translateY(calc(100% - var(--peek))); transition: transform 260ms cubic-bezier(.32, .72, 0, 1); }
    .drawer[data-snap="half"] { transform: translateY(45%); }
    .drawer[data-snap="full"] { transform: translateY(0); }
    .drawer.dragging { transition: none; }
    .handle { border: 0; background: transparent; padding: 10px 0 4px; width: 100%; display: grid; place-items: center; min-height: 28px; touch-action: none; cursor: grab; }
    .handle i { width: 44px; height: 5px; border-radius: 99px; background: var(--input); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 16px 10px; }
    .drawer-head h2 { font: 600 17px var(--display); }
    .drawer-head p { font-size: 12px; color: var(--muted-foreground); }
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 12px; }
    .tile { padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
    .tile .label { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .value { font: 650 26px/1.15 var(--display); font-variant-numeric: tabular-nums; }
    .tile .value small { font-size: 13px; font-weight: 500; color: var(--muted-foreground); margin-left: 2px; }
    .tile .state { margin-top: 2px; font-size: 11px; display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .state .icon svg { width: 13px; height: 13px; }
    .tabs { display: flex; gap: 4px; margin: 14px 12px 0; padding: 4px; background: var(--muted); border-radius: 999px; }
    .tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--muted-foreground); font-weight: 600; font-size: 14px; }
    .tabs button[aria-selected="true"] { background: var(--card); color: var(--foreground); box-shadow: 0 1px 3px #0000002e; }
    .drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px calc(20px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .card + .card { margin-top: 10px; }
    .card h3 { font-size: 15px; font-weight: 600; }
    .card .sub { font-size: 12px; color: var(--muted-foreground); }
    .chart { height: 200px; position: relative; margin-top: 10px; }
    .chart canvas { width: 100%; height: 100%; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--muted-foreground); }
    .legend svg { vertical-align: middle; margin-right: 5px; }
    .list { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); min-height: 56px; background: transparent; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
    .row:last-child { border-bottom: 0; }
    button.row:hover { background: var(--muted); border-radius: 10px; }
    .row[aria-current="true"] { background: var(--accent); border-radius: 10px; }
    .row .idx { width: 32px; height: 32px; border-radius: 99px; background: var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
    .row .main { flex: 1; min-width: 0; }
    .row .main strong { display: block; font-size: 14px; }
    .row .main span { font-size: 12px; color: var(--muted-foreground); }
    .row .val { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
    .row .val small { display: block; font-weight: 500; font-size: 11px; color: var(--muted-foreground); }
    .empty { text-align: center; padding: 28px 12px; }
    .empty .icon { width: 48px; height: 48px; border-radius: 99px; background: var(--muted); display: inline-grid; place-items: center; margin-bottom: 10px; }
    .empty h3 { font-size: 16px; }
    .empty p { font-size: 13px; color: var(--muted-foreground); margin-top: 4px; }
    .alert { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius); background: var(--muted); font-size: 13px; }
    .alert .icon { color: var(--warning); }
    .alert strong { display: block; }
    .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .report-grid .card + .card { margin-top: 0; }
    .big { font: 650 28px/1.2 var(--display); font-variant-numeric: tabular-nums; margin: 4px 0; }
    .big small { font-size: 13px; color: var(--muted-foreground); font-weight: 500; margin-left: 3px; }
    .footnote { margin-top: 12px; font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
    dialog { border: 0; border-radius: var(--radius-lg); background: var(--popover); color: var(--foreground); padding: 0; width: min(420px, calc(100vw - 24px)); }
    dialog::backdrop { background: #0009; }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
    .dialog-body { padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
    .setting { display: flex; justify-content: space-between; align-items: center; min-height: 48px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .setting:last-child { border-bottom: 0; }
    #toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: var(--foreground); color: var(--background); font-size: 13px; z-index: 30; white-space: nowrap; }

    /* Desktop: drawer becomes a right-hand Sheet panel */
    @media (min-width: 960px) {
      body { overflow: auto; }
      .app { grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto auto minmax(0, 1fr); column-gap: 0; }
      .topbar, .segmented { grid-column: 1; }
      .segmented { max-width: 460px; justify-self: center; width: 100%; }
      .option-badge { position: static; transform: none; }
      .stage-area { grid-column: 1; padding: 0 24px 24px; }
      .drawer { position: relative; grid-column: 2; grid-row: 1 / span 3; height: 100svh; transform: none !important; border-radius: 0; border-top: 0; border-left: 1px solid var(--border); box-shadow: none; transition: none; }
      .handle { display: none; }
      .drawer-head { padding-top: 18px; }
    }
    @media (max-width: 959px) { .option-badge { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="button ghost icon-only" id="import-button" aria-label="Open local video"><span class="icon" data-icon="upload-simple"></span></button>
    <div class="title"><strong id="clip-title">sample1.MOV</strong><span id="clip-meta" class="num">Front view · 7.7 s · Real video</span></div>
    <span class="badge option-badge">Option C · Mobile focus</span>
    <button class="button ghost icon-only" id="theme-button" aria-label="Switch theme"><span class="icon" data-icon="sun"></span></button>
    <button class="button ghost icon-only" data-open="settings-dialog" aria-label="Settings"><span class="icon" data-icon="sliders-horizontal"></span></button>
  </header>
  <div class="segmented" role="group" aria-label="Analysis mode">
    <button aria-pressed="true" data-mode="squat">Single-leg squat</button>
    <button aria-pressed="false" data-mode="tennis">Tennis groundstrokes</button>
  </div>
  <div class="stage-area">
    <div class="stage" id="stage-box">
      <video id="clip" src="assets/sample1-360p.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
      <canvas id="stage" role="img" aria-label="Skeleton overlay"></canvas>
      <span class="chip tl" id="chip-left"><span class="icon" data-icon="check-circle"></span>Skeleton only</span>
      <span class="chip tr num" id="chip-right">F 0000</span>
    </div>
    <div class="transport">
      <button class="play" id="play" aria-label="Play"><span class="icon" data-icon="play"></span></button>
      <button class="button ghost icon-only" id="prev" aria-label="Previous frame"><span class="icon" data-icon="skip-back"></span></button>
      <div class="scrub-wrap"><div class="marks" id="marks"></div><label class="sr-only" for="scrub">Playback position</label><input type="range" id="scrub" min="0" max="851" value="0"></div>
      <button class="button ghost icon-only" id="next" aria-label="Next frame"><span class="icon" data-icon="skip-forward"></span></button>
      <span class="time num" id="time">00:00.0</span>
    </div>
  </div>

  <section class="drawer" id="drawer" data-snap="peek" aria-label="Measurements">
    <button class="handle" id="handle" aria-label="Expand measurements" aria-expanded="false"><i></i></button>
    <div class="drawer-head">
      <div><h2 id="now-title">This frame</h2><p id="now-sub" class="num">Image plane · 2D projected angles</p></div>
      <span class="badge" id="demo-badge">Demo data</span>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="tabs" role="tablist" aria-label="Measurement views" id="tabs"></div>
    <div class="drawer-body" id="drawer-body"></div>
  </section>
</div>

<dialog id="settings-dialog" aria-labelledby="settings-title">
  <div class="dialog-head"><h2 id="settings-title" style="font-size: 17px">Settings</h2><button class="button ghost icon-only" data-close aria-label="Close"><span class="icon" data-icon="x"></span></button></div>
  <div class="dialog-body">
    <div class="setting"><span>Racket hand</span><span class="muted">Right</span></div>
    <div class="setting"><span>Pose model</span><span class="muted">Pose Landmarker heavy · precomputed</span></div>
    <div class="setting"><span>Cloud sync</span><span class="muted">Not connected</span></div>
    <div class="setting"><span>Language</span><span>English</span></div>
    <button class="button primary" data-close style="margin-top: 10px">Done</button>
  </div>
</dialog>
<input type="file" id="file" accept="video/*" hidden>
<div id="toast" role="status" hidden></div>

    m.marks().forEach(k => { const x = X(k.t); c.fillStyle = k.na ? css('--muted-foreground') : css('--foreground'); c.beginPath(); c.moveTo(x, T + ph + 12); c.lineTo(x - 5, T + ph + 20); c.lineTo(x + 5, T + ph + 20); c.fill(); });
    const x = X(state.time); c.strokeStyle = css('--select'); c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, T); c.lineTo(x, T + ph); c.stroke();
  }
  function tick(ts) {
    if (state.playing) {
      if (usesVideo()) { if (!clip.paused) setTime(clip.currentTime, true); else if (clip.readyState < 2) { if (state.last) setTime(state.time + Math.min((ts - state.last) / 1000, .1) * .5, true); state.last = ts; } }
      else { if (state.last) setTime(state.time + Math.min((ts - state.last) / 1000, .1) * .5); state.last = ts; }
      if (state.time >= state.mode.duration) setPlaying(false);
    }
    requestAnimationFrame(tick);
  }
  new ResizeObserver(() => { drawStage(); drawChart(); }).observe(byId('stage-box'));
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPlaying(false); });

  setTheme(matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  setMode('squat');
  syncClip();
  requestAnimationFrame(tick);
</script>
</body>
</html>
