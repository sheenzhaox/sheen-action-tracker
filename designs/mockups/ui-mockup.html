<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Action Tracker · UI 静态原型 v0.1</title>
<!--
  静态设计原型（非产品代码，未部署）。规范来源：
  - ../design-system/action-tracker/MASTER.md（颜色、字体、组件、反模式）
  - ../08-ui-ux.md（页面、流程、文案）
  无外部请求：系统字体栈代替 Barlow（产品中自托管 Barlow），图标为内联 SVG 示意（产品中用 Phosphor）。
-->
<style>
:root, [data-theme="dark"] {
  --bg:#1F2937; --card:#313742; --muted:#37414F; --fg:#F8FAFC; --fg-muted:#CBD5E1;
  --primary:#F97316; --on-primary:#0F172A; --primary-text:#FB923C;
  --border:#374151; --control-border:#8A94A6; --ring:#FDBA74;
  --destructive:#EF4444; --warning:#FBBF24; --stage:#000;
  --valid:#22C55E; --experimental:#C4B5FD; --unavailable:#94A3B8;
  --skel-left:#22D3EE; --skel-right:#F97316; --skel-center:#F8FAFC; --skel-key:#FDE047; --skel-halo:rgba(0,0,0,.75);
  --page:#111827; --shadow:none;
}
[data-theme="light"] {
  --bg:#F8FAFC; --card:#FFFFFF; --muted:#F1F5F9; --fg:#0F172A; --fg-muted:#475569;
  --primary:#EA580C; --on-primary:#0F172A; --primary-text:#C2410C;
  --border:#E2E8F0; --control-border:#64748B; --ring:#C2410C;
  --destructive:#DC2626; --warning:#B45309;
  --valid:#15803D; --experimental:#6D28D9; --unavailable:#475569;
  --page:#E2E8F0; --shadow:0 1px 2px rgba(15,23,42,.06);
}
* { box-sizing:border-box; }
html, body { margin:0; }
body {
  background:var(--page); color:var(--fg);
  font-family:"Barlow", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.num, .display { font-family:"Barlow Condensed", "SF Pro Display", -apple-system, "Segoe UI", "PingFang SC", sans-serif; font-variant-numeric:tabular-nums; }
:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
button { font:inherit; color:inherit; cursor:pointer; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; } }

/* ---------- 原型外壳 ---------- */
.doc-head { max-width:1200px; margin:0 auto; padding:24px 20px 8px; display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:space-between; }
.doc-head h1 { margin:0; font-size:22px; }
.doc-head p { margin:4px 0 0; color:var(--fg-muted); font-size:14px; }
.gallery { display:flex; flex-wrap:wrap; gap:32px; justify-content:center; padding:16px 20px 48px; }
figure.shot { margin:0; display:flex; flex-direction:column; align-items:center; gap:10px; }
figure.shot figcaption { font-size:14px; color:var(--fg-muted); text-align:center; max-width:390px; }
figure.shot figcaption b { color:var(--fg); }

.phone {
  width:390px; height:844px; border-radius:48px; overflow:hidden; position:relative;
  background:var(--bg); border:10px solid #0B0F17; box-shadow:0 20px 40px rgba(0,0,0,.35);
  display:flex; flex-direction:column;
}
.statusbar { height:47px; flex:none; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 6px; font-size:15px; font-weight:600; }
.statusbar .island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:120px; height:34px; border-radius:20px; background:#000; }
.home-ind { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:var(--fg); opacity:.6; pointer-events:none; }
.content { flex:1; overflow:auto; padding:0 16px; scrollbar-width:none; }
.content::-webkit-scrollbar { display:none; }
.content.flush { padding:0; }

/* ---------- 通用组件 ---------- */
.topbar { height:44px; flex:none; display:flex; align-items:center; gap:4px; padding:0 4px; }
.topbar h2 { flex:1; margin:0; font-size:17px; font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.large-title { font-size:32px; font-weight:700; margin:4px 0 12px; }
.icon-btn { width:44px; height:44px; display:inline-grid; place-items:center; border:0; background:transparent; border-radius:12px; }
.icon-btn svg, .ico { width:24px; height:24px; flex:none; }
.ico-sm { width:18px; height:18px; flex:none; }

.btn { min-height:44px; padding:0 16px; border-radius:12px; border:0; font-weight:600; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary { background:var(--primary); color:var(--on-primary); }
.btn-secondary { background:transparent; color:var(--fg); border:1px solid var(--control-border); }
.btn-text { background:transparent; color:var(--primary-text); }
.btn-block { width:100%; }

.card { background:var(--card); border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px; }
.card h3 { margin:0 0 4px; font-size:17px; }
.meta { color:var(--fg-muted); font-size:14px; }
.section-title { font-size:13px; font-weight:600; color:var(--fg-muted); text-transform:none; margin:18px 4px 8px; }

.badge { display:inline-flex; align-items:center; gap:4px; min-height:24px; padding:2px 8px; border-radius:999px; font-size:13px; font-weight:600; border:1px solid currentColor; }
.st-valid { color:var(--valid); } .st-exp { color:var(--experimental); } .st-na { color:var(--unavailable); }
.st-warn { color:var(--warning); }
.chip-tag { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:8px; background:var(--muted); color:var(--fg-muted); font-size:13px; font-weight:600; }

.seg { display:flex; padding:3px; border-radius:12px; background:var(--muted); gap:3px; }
.seg button { flex:1; min-height:38px; border:0; border-radius:9px; background:transparent; color:var(--fg-muted); font-weight:600; font-size:15px; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"], .seg button[aria-checked="true"] { background:var(--card); color:var(--fg); box-shadow:0 0 0 1px var(--control-border); }

.row { display:flex; align-items:center; gap:12px; min-height:44px; }
.row + .row { border-top:1px solid var(--border); }
.row .k { color:var(--fg-muted); font-size:15px; flex:none; width:84px; }
.row .v { flex:1; font-size:15px; }

.switch { position:relative; width:51px; height:31px; flex:none; border-radius:16px; border:1px solid var(--control-border); background:var(--muted); padding:0; }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:25px; height:25px; border-radius:50%; background:var(--fg-muted); transition:left .2s ease-out; }
.switch[aria-checked="true"] { background:var(--primary); border-color:var(--primary); }
.switch[aria-checked="true"]::after { left:22px; background:var(--on-primary); }

.alert { display:flex; gap:10px; align-items:flex-start; padding:12px; border-radius:12px; background:var(--muted); font-size:14px; }
.alert .ico-sm { margin-top:2px; }
.alert b { display:block; font-size:15px; }

.tabbar { flex:none; display:flex; border-top:1px solid var(--border); background:var(--card); padding:4px 0 30px; }
.tabbar button { flex:1; border:0; background:transparent; min-height:49px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; color:var(--fg-muted); }
.tabbar button[aria-current="page"] { color:var(--primary-text); }

.sticky-foot { flex:none; padding:12px 16px 34px; background:var(--bg); border-top:1px solid var(--border); }

/* ---------- 回放页 ---------- */
.stage { background:var(--stage); height:360px; position:relative; display:flex; justify-content:center; }
.stage svg.video { height:100%; width:auto; display:block; }
.stage .overlay-btn { position:absolute; min-height:36px; padding:0 10px; border-radius:10px; border:0; background:rgba(0,0,0,.6); color:#F8FAFC; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:4px; }
.legend { position:absolute; left:8px; top:52px; background:rgba(0,0,0,.72); color:#F8FAFC; border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.6; }
.legend svg { vertical-align:middle; }
.transport { display:flex; align-items:center; justify-content:space-between; padding:0 6px; height:52px; border-bottom:1px solid var(--border); }
.transport .speed { min-width:44px; min-height:44px; border:1px solid var(--control-border); border-radius:10px; background:transparent; font-weight:700; font-size:14px; }
.play { width:48px; height:48px; border-radius:50%; border:0; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; }
.timeline { padding:6px 16px 4px; }
.timeline .times { display:flex; justify-content:space-between; font-size:12px; color:var(--fg-muted); }
.chips { display:flex; gap:8px; overflow-x:auto; padding:8px 16px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; min-height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--control-border); background:transparent; font-size:14px; font-weight:600; color:var(--fg); }
.chip[aria-pressed="true"] { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.values { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:4px 16px 16px; }
.value { background:var(--card); border-radius:12px; padding:8px 10px; }
.value .lbl { font-size:12px; color:var(--fg-muted); }
.value .big { font-size:28px; font-weight:700; line-height:1.1; }

/* ---------- 报告页 ---------- */
.metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.metric { background:var(--card); border-radius:14px; padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:4px; }
.metric .name { font-size:13px; color:var(--fg-muted); }
.metric .big { font-size:34px; font-weight:700; line-height:1; }
.metric .big small { font-size:16px; font-weight:600; color:var(--fg-muted); margin-left:2px; }
.metric .reason { font-size:13px; color:var(--fg-muted); }
.event { display:flex; align-items:center; gap:10px; min-height:52px; border-top:1px solid var(--border); font-size:15px; }
.event:first-child { border-top:0; }
.event .idx { width:32px; color:var(--fg-muted); }
.event .t { margin-left:auto; color:var(--primary-text); font-weight:600; }

/* ---------- 处理中 ---------- */
.steps { list-style:none; margin:0; padding:0; }
.steps li { display:flex; gap:12px; align-items:center; min-height:44px; font-size:15px; }
.steps li .s { margin-left:auto; font-size:14px; color:var(--fg-muted); }
.steps li.done { color:var(--fg-muted); }
.steps li.now { font-weight:700; }
.bar { height:8px; border-radius:4px; background:var(--muted); overflow:hidden; margin:8px 0 4px; }
.bar > i { display:block; height:100%; width:46%; background:var(--primary); }

.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>

<script>
  (function () {
    var root = document.documentElement;
    var btns = document.querySelectorAll('[data-set-theme]');
    function apply(t) {
      root.setAttribute('data-theme', t);
      btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.setTheme === t)); });
    }
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) apply('light');
    btns.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.setTheme); }); });
  })();
</script>
